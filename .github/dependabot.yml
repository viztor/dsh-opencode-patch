# Keep the two things a release depends on current, and the toolchain they run
# on. Release automation is the part of this repository that cannot be tested
# until it matters, so the actions it runs are the highest-value thing to keep
# un-stale.
version: 2

updates:
  # The release path. A stale action here is how a tag silently stops producing a
  # publish, and the workflow would still be green.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels:
      - ci
      - dependencies
    commit-message:
      prefix: ci
    groups:
      # One PR for the whole action set: they move together and are only ever
      # validated as a set by a real run.
      actions:
        patterns:
          - "*"

  # The plugin's own dependencies. Grouped so a routine bump does not arrive as
  # a dozen PRs; the lockfile is the unit that is actually tested.
  #
  # Every pull request this opens also needs `channels/rc/pnpm-lock.yaml`
  # relocked, which Dependabot cannot do: that lockfile is the root one with the
  # host packages re-resolved, so it carries every specifier in `package.json`
  # and CI's rc cell installs it frozen. Push one commit running
  # `node --experimental-strip-types scripts/use-channel.ts rc --relock` onto
  # the pull request; `test/harness-channel.test.ts` names that command when
  # the two lockfiles disagree.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: build
    groups:
      dev-dependencies:
        dependency-type: development
      dependencies:
        dependency-type: production
      # A toolchain upgrade that fails `scripts/check.ts`'s toolchain guards is
      # expected; so is one that rewrites the lockfile wholesale.
      tooling:
        patterns:
          - vite-plus
          - ultracite
          - typescript
          - vitest
          - "@vitest/*"
    ignore:
      # The harness cluster and pi move only as a channel bump (D22''), never
      # as a dependency update: a bump moves a channel record in
      # `test/support/host-versions.ts`, that channel's lockfile and, for alpha,
      # `package.json`'s exact `@deepseek-ai/*` pins together (CONTRIBUTING's
      # release step 3), and pi is the bridge's, at the newest 1.x its range
      # resolves, pinned per channel. A pull request from here would move one of
      # them, land red on `test/harness-channel.test.ts`, and take its whole
      # group with it. The nightly `host-drift` job reports when either channel
      # moves, and P-T3 (a later phase) turns that report into the bump. Every
      # update type is ignored; `test/harness-channel.test.ts` holds both rules.
      - dependency-name: "@deepseek-ai/*"
      - dependency-name: "@earendil-works/pi-ai"
      # React stays at 18: the bundles this plugin ships are host-bound, so a
      # major here is a coordinated move with the host rather than a bump - and
      # it is not hypothetical: under react-dom 19 the settings suite fails
      # (`reports a refusal, which is terminal`), which is what the react group
      # PR demonstrated. Minors and patches inside 18 are welcome.
      - dependency-name: react
        update-types:
          - version-update:semver-major
      - dependency-name: react-dom
        update-types:
          - version-update:semver-major
      - dependency-name: "@types/react"
        update-types:
          - version-update:semver-major
