# Keep the two things a release depends on current, and the toolchain they run
# on. Release automation is the part of this repository that cannot be tested
# until it matters, so the actions it runs are the highest-value thing to keep
# un-stale.
version: 2

updates:
  # The release path. A stale action here is how a tag silently stops producing a
  # publish, and the workflow would still be green.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels:
      - ci
      - dependencies
    commit-message:
      prefix: ci
    groups:
      # One PR for the whole action set: they move together and are only ever
      # validated as a set by a real run.
      actions:
        patterns:
          - "*"

  # The plugin's own dependencies. Grouped so a routine bump does not arrive as
  # a dozen PRs; the lockfile is the unit that is actually tested.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: build
    groups:
      dev-dependencies:
        dependency-type: development
      dependencies:
        dependency-type: production
      # A toolchain upgrade that fails `scripts/check.ts`'s toolchain guards is
      # expected; so is one that rewrites the lockfile wholesale.
      tooling:
        patterns:
          - vite-plus
          - ultracite
          - typescript
          - vitest
          - "@vitest/*"
    ignore:
      # pi-ai follows the line the main dsh installs, not the registry. The plane
      # adapter loads pi from the wrapper's copy, so our pin has to satisfy the range the
      # wrapper declares - now `^1.1.0`, where minor releases stay inside the range
      # and a major does not. A second pi beside the wrapper's is the failure this
      # prevents: two module instances drift apart the moment either side moves, and
      # `test/host-versions.test.ts` asserts the pin satisfies the range, so a major
      # here would land red rather than break something quietly. Minors are
      # welcome - they stay inside the wrapper's range - so only majors are ignored.
      - dependency-name: "@earendil-works/pi-ai"
        update-types:
          - version-update:semver-major
      # React stays at 18: the bundles this plugin ships are host-bound, so a
      # major here is a coordinated move with the host rather than a bump - and
      # it is not hypothetical: under react-dom 19 the settings suite fails
      # (`reports a refusal, which is terminal`), which is what the react group
      # PR demonstrated. Minors and patches inside 18 are welcome.
      - dependency-name: react
        update-types:
          - version-update:semver-major
      - dependency-name: react-dom
        update-types:
          - version-update:semver-major
      - dependency-name: "@types/react"
        update-types:
          - version-update:semver-major
