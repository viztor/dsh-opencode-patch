name: ci

on:
  push:
    branches: [main]
    tags-ignore: ["v*.*.*"]
  pull_request:
  workflow_dispatch:
  # Nightly, so a vendor-side change is caught here rather than by a user's
  # meter. The e2e suite is the only thing that talks to OpenCode, and the
  # bundled catalog is the only thing that tracks models.dev — both are exactly
  # the kind of contract that rots quietly between commits.
  schedule:
    - cron: "37 4 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check · test · build · gate
    runs-on: ubuntu-latest
    # A hung test otherwise burns the six-hour default. Everything here is
    # offline and fast; twenty minutes is generous, not tight.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No `version:` input: pnpm/action-setup refuses to run when it is given
      # both that and a `packageManager` field, and package.json pins 12.6.0
      # exactly. One source of truth, and the action reads it.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run test
      # The zen/go compatibility matrix, offline: `test/mock/` boots a Vite
      # server that answers the gateway's endpoints in their own wire formats
      # and refuses a request whose shape its endpoint does not accept.
      # Deterministic and secretless, so unlike the e2e job it gates every
      # push and every PR.
      - run: pnpm run test:mock
      - run: pnpm run build
      - run: node --experimental-strip-types scripts/check.ts
      # Coverage as its own step, not folded into `test`: the ratchet only means
      # something if it can fail a build. Uploaded so a PR can be diffed against
      # `main` rather than only against the threshold.
      - run: pnpm run test:coverage
      - name: upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage
          retention-days: 7

  # `engines.node` promises >=24 and every other job runs 26, so the floor was a
  # claim nothing exercised. The suites that depend on the engine (node:sqlite,
  # Intl.DurationFormat and its ICU strings) are exactly the ones that differ
  # between majors, so the floor gets its own offline run of the unit and mock
  # suites. Raise this together with `engines.node`.
  engine-floor:
    name: test · node 24 (engines floor)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Shuffled here, and in order in the main job: the two runs together show a
      # case that passes only because of what an earlier case left behind. The
      # seed is printed, so a failure reproduces with `--sequence.seed=<n>`.
      - run: pnpm run test:shuffle
      - run: pnpm run test:mock

  # The bundled catalog is generated from models.dev, and the one field that went
  # stale before (`provider_npm`) put nine models on an endpoint that cannot
  # serve them — a WRONG answer rather than a missing one, and invisible to the
  # unit suite. Regenerating on a schedule turns the vendor's next change into a
  # diff to review instead of a bug to diagnose.
  #
  # WHAT THIS GATES, and what it deliberately does not. The failure it exists
  # for is an OMISSION: someone changes the catalog and forgets to regenerate,
  # so the wrong `provider_npm` ships. That is fixable before merging, so a
  # PULL REQUEST fails on a stale shim.
  #
  # A push to main is a different question. `main` was reviewed with a current
  # shim; the vendor may have rotated rows in the minutes since. The runtime
  # already refreshes the catalog on its own (SWR, 1h TTL), so a shim a few
  # hours behind only affects a cold start - it is not a regression the push
  # introduced. Failing there turned upstream churn into a red main several
  # times in one afternoon, which is how a signal gets ignored. So on main it
  # REPORTS (a warning, and the nightly proposes the refresh) rather than
  # failing.
  #
  # Fork PRs are skipped: the job reaches the public internet, and a fork's
  # copy would answer "stale" for everyone.
  catalog:
    name: catalog freshness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Write access is needed by the nightly path alone, which proposes the
    # refresh as a pull request instead of failing. The gate steps never write.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: is src/catalog-data.ts current? (pull requests)
        if: github.event_name == 'pull_request'
        run: |
          # Exits 1 on a stale shim and prints what would change. A PR is where
          # a forgotten regeneration is still fixable, so this one is a gate.
          pnpm run catalog:shim || {
            echo "::error::src/catalog-data.ts is out of date — run 'pnpm run catalog:shim -- --write' and commit the result."
            exit 1
          }
      - name: report a stale catalog (pushes to main)
        if: github.event_name == 'push'
        run: |
          # A warning, not a failure: main was reviewed with a current shim, and
          # the vendor moving since then is not a regression this push caused.
          # The nightly run proposes the refresh.
          pnpm run catalog:shim \
            || echo "::warning::src/catalog-data.ts is stale - the registry moved since this commit; the nightly refresh will propose it."
      # The Go plan's per-model dollar allowance, from OpenCode's own docs. It
      # moves when THEY move — the page says limits "may change as we learn from
      # early usage and feedback" — and a stale table shows a wrong dollar figure
      # that looks authoritative, which is worse than showing none.
      - name: is src/go-limits-data.ts current? (pull requests)
        if: github.event_name == 'pull_request'
        run: |
          pnpm run limits:shim || {
            echo "::error::src/go-limits-data.ts is out of date — run 'pnpm run limits:shim -- --write' and commit the result."
            exit 1
          }
      - name: report a stale limits table (pushes to main)
        if: github.event_name == 'push'
        run: |
          pnpm run limits:shim \
            || echo "::warning::src/go-limits-data.ts is stale - the vendor's docs page moved since this commit."

      # The nightly run exists to NOTICE vendor drift, and drift is the normal
      # case - the sources move most days. Failing here meant a red run every
      # night, which trains everyone to ignore the signal. So the nightly path
      # regenerates and proposes a pull request, and the refresh gates above
      # run on pull requests (where a forgotten regeneration is still fixable)
      # while a push to main only reports.
      #
      # The User-Agent names the CLI version, and the vendor moves it every few
      # days - which is the same shape again: a vendor release is not a reason
      # to go red, so this one warns everywhere except a pull request.
      - name: the claimed CLI version is the published one (pull requests)
        if: github.event_name == 'pull_request'
        run: pnpm run cli:version
      - name: report a stale CLI version (push and nightly)
        if: github.event_name != 'pull_request'
        run: pnpm run cli:version || echo "::warning::the pinned opencode CLI version is not the published one"

      - name: propose the refresh (nightly only)
        if: github.event_name == 'schedule'
        env:
          # PAT, not GITHUB_TOKEN. The push decides the run: a branch pushed
          # with the checkout credential is attributed to github-actions[bot],
          # and GitHub parks the pull_request run in action_required - the
          # first refresh arrived that way, with no CI until a human approved
          # the run by hand. Pushed with the PAT the actor is the PAT's owner,
          # which is how the release PRs get their checks. Same secret
          # release-please uses.
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          pnpm run catalog:shim -- --write
          pnpm run limits:shim -- --write
          # The generators emit compact JSON; the repository formats its
          # sources. Without this the comparison below always sees a diff and
          # every nightly run would open a pull request whose entire content is
          # reformatting - the opposite of "open one when upstream moved".
          pnpm exec vp fmt --write src/catalog-data.ts src/go-limits-data.ts
          if git diff --quiet -- src/catalog-data.ts src/go-limits-data.ts; then
            echo "both generated files are current - no upstream change, no pull request"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B chore/generated-refresh
          git add src/catalog-data.ts src/go-limits-data.ts
          git commit -m "chore: refresh the generated catalog and limits tables"
          # Explicit token URL: `origin` carries the checkout credential, and
          # a push through it is what lands the run in action_required.
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" chore/generated-refresh
          gh pr create --head chore/generated-refresh \
            --title "chore: refresh the generated catalog and limits tables" \
            --body "The nightly freshness check found the vendor sources moved. Regenerated by CI - review the diff and merge." \
            || echo "a refresh pull request is already open"

  # The live gateway contract: the only job that talks to OpenCode itself, so a
  # vendor payload change fails here rather than in a user's meter.
  #
  # Secrets are not exposed to fork or Dependabot PRs, and every credentialed
  # case skips when its key is absent — so this stays green there while still
  # checking that the endpoints answer. Add OPENCODE_API_KEY (Zen) and
  # OPENCODE_GO_API_KEY (Go plan) under Settings → Secrets → Actions to arm the
  # keyed cases.
  e2e:
    name: e2e · live gateway
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:e2e
        env:
          OPENCODE_E2E: "1"
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}

  # The published host binary with this checkout linked into a throwaway
  # profile: the only run that boots `dsh` itself rather than the host packages
  # the unit suite assembles. `test/e2e/host/probe-plugin.mjs` measures the
  # registry, the listings, validation, where each turn is sent and the save of
  # a catalog-unknown id, and `test/e2e/host-binary.e2e.ts` asserts today's
  # rows (`S0_TODAY`, shared with the in-process characterization).
  #
  # Two cells. `pinned` installs the host with npm `overrides` forcing pi to
  # the version `test/support/host-versions.ts` names and applies the
  # harness's own patch; `floating` takes whatever pi npm resolves for the
  # published host (newer than the harness pins), so a pi release that moves
  # the ground shows up nightly. Pull requests run `pinned` only, and only when
  # they touch the host seam; dispatch and the nightly run both cells.
  #
  # The scope is decided by a step rather than by `on.pull_request.paths`: a
  # workflow-level path filter would silence every other job in this file.
  # Offline: the probe answers every gateway request itself, and the keys it
  # stores are dummies. No secret is passed.
  e2e-host:
    name: e2e · host binary (${{ matrix.cell }})
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        cell: ${{ github.event_name == 'pull_request' && fromJSON('["pinned"]') || fromJSON('["pinned","floating"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: does this change touch the host seam?
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Its own command, so a diff that cannot be computed (a base ref
          # that was not fetched, a deleted base branch) fails the step rather
          # than reading as "nothing changed" and skipping the job green.
          changed="$(git diff --name-only "origin/${BASE_REF}...HEAD")"
          # The job's own definition and runner config are in scope: a pull
          # request that breaks the install, the override, the patch step or
          # the e2e config must run the job it breaks. That includes
          # vite.config.ts: it holds the pack config that builds lib/index.mjs
          # (the only test that loads that bundle into a real host is this
          # one, and its externals keep cordis and schemastery the host's
          # copies) and the test settings vitest.e2e.config.ts inherits.
          # package.json is not (every dependency bump touches it), so a
          # change to its `test:e2e:host` script alone is exercised only by
          # the nightly run.
          # The host seam lives under src/host/ (the route claim, the plane
          # adapter, the Settings graft, the host-module loaders), and the
          # modules whose behaviour depends on the real loader and apply order
          # sit beside it by name: the composition (lifecycle.ts, identity.ts),
          # the host-module seam (cordis-context.ts), the remaining discovery
          # patch (models-discovery.ts), and the two modules that still install
          # host-level patches until P6/P10a move them under src/host/: the
          # global fetch wrapper (fetch-patch.ts, whose order the probe reads
          # as fetchInnermost) and the llm/stream hook (stream-hook.ts). Every
          # other row producer (the pure
          # plane profile and model in src/utils/, key-capture.ts,
          # models-catalog.ts, config.ts, the generated catalog) is covered on
          # each pull request by the in-process characterization of the same
          # S0_TODAY rows, and here by the nightly run.
          if printf '%s\n' "$changed" \
            | grep -Eq '^(src/host/|src/lifecycle\.ts$|src/identity\.ts$|src/cordis-context\.ts$|src/models-discovery\.ts$|src/fetch-patch\.ts$|src/stream-hook\.ts$|cordis\.patch\.yml$|test/e2e/host/|test/e2e/host-binary\.e2e\.ts$|test/support/host\.ts$|test/support/host-versions\.ts$|patches/|\.github/workflows/ci\.yml$|vitest\.e2e\.config\.ts$|vite\.config\.ts$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "no host-seam path changed; the host binary e2e does not run for this pull request"
          fi
      - if: steps.scope.outputs.run == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - if: steps.scope.outputs.run == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - if: steps.scope.outputs.run == 'true'
        run: pnpm install --frozen-lockfile
      - name: the host versions this repository pins
        id: versions
        if: steps.scope.outputs.run == 'true'
        run: |
          node --experimental-strip-types --input-type=module -e "import { HOST_VERSIONS } from './test/support/host-versions.ts'; console.log('dsh=' + HOST_VERSIONS.dsh); console.log('pi=' + HOST_VERSIONS.pi)" >> "$GITHUB_OUTPUT"
          echo "PREFIX=$RUNNER_TEMP/dsh-host" >> "$GITHUB_ENV"
      # The pinned install is reproducible, so it is cached by the versions
      # and the patch; the floating one is the point of re-resolving, so never.
      - name: cache the pinned host install
        id: host-cache
        if: steps.scope.outputs.run == 'true' && matrix.cell == 'pinned'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/dsh-host
          key: dsh-host-${{ matrix.cell }}-${{ steps.versions.outputs.dsh }}-${{ steps.versions.outputs.pi }}-${{ hashFiles('patches/*.patch') }}
      - name: install the published host into a throwaway prefix
        if: steps.scope.outputs.run == 'true' && steps.host-cache.outputs.cache-hit != 'true'
        env:
          CELL: ${{ matrix.cell }}
          DSH: ${{ steps.versions.outputs.dsh }}
          PI: ${{ steps.versions.outputs.pi }}
        run: |
          mkdir -p "$PREFIX"
          # The overrides must be in the prefix's own package.json BEFORE the
          # install, or npm resolves the wrapper's ^range to the newest pi.
          if [ "$CELL" = pinned ]; then
            printf '{ "private": true, "overrides": { "@earendil-works/pi-ai": "%s" } }\n' "$PI" > "$PREFIX/package.json"
          else
            printf '{ "private": true }\n' > "$PREFIX/package.json"
          fi
          npm install --prefix "$PREFIX" --no-audit --no-fund "@deepseek-ai/dsh@$DSH"
          # Only on a fresh install: re-applying to a cached, patched copy fails.
          if [ "$CELL" = pinned ]; then
            patch -p1 -d "$PREFIX/node_modules/@earendil-works/pi-ai" < "patches/@earendil-works__pi-ai@$PI.patch"
          fi
      - name: assert the pi the host resolved
        if: steps.scope.outputs.run == 'true'
        env:
          CELL: ${{ matrix.cell }}
          PI: ${{ steps.versions.outputs.pi }}
        run: |
          resolved="$(node -p "require(process.env.PREFIX + '/node_modules/@earendil-works/pi-ai/package.json').version")"
          echo "cell $CELL: pi $resolved"
          copies="$(find "$PREFIX/node_modules" -path '*/@earendil-works/pi-ai/package.json' | wc -l)"
          if [ "$copies" -ne 1 ]; then
            echo "::error::expected one copy of pi under the host prefix, found $copies"
            exit 1
          fi
          if [ "$CELL" = pinned ] && [ "$resolved" != "$PI" ]; then
            echo "::error::the pinned cell resolved pi $resolved, not $PI"
            exit 1
          fi
      - if: steps.scope.outputs.run == 'true'
        run: pnpm run build
      - name: boot the host binary with the probe
        if: steps.scope.outputs.run == 'true'
        run: pnpm run test:e2e:host --run
        env:
          DSH_HOST_E2E: "1"
          DSH_HOST_PREFIX: ${{ runner.temp }}/dsh-host
          DSH_HOST_PI_CELL: ${{ matrix.cell }}
          DSH_HOST_PROBE_COPY: ${{ runner.temp }}/probe-${{ matrix.cell }}.json
      - name: upload the probe's measurement
        if: always() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: host-probe-${{ matrix.cell }}
          path: ${{ runner.temp }}/probe-${{ matrix.cell }}.json
          if-no-files-found: ignore
          retention-days: 7
