name: ci

on:
  push:
    branches: [main]
    tags-ignore: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # No `version:` input: pnpm/action-setup refuses to run when it is given
      # both that and a `packageManager` field, and package.json pins 12.6.0
      # exactly. One source of truth, and the action reads it.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run test
      - run: pnpm run build
      - run: node --experimental-strip-types scripts/check.ts
