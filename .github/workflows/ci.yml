name: ci

on:
  push:
    branches: [main]
    tags-ignore: ["v*.*.*"]
  pull_request:
  workflow_dispatch:
  # Nightly, so a vendor-side change is caught here rather than by a user's
  # meter. The e2e suite is the only thing that talks to OpenCode, and the
  # bundled catalog is the only thing that tracks models.dev — both are exactly
  # the kind of contract that rots quietly between commits.
  schedule:
    - cron: "37 4 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check · test · build · gate
    runs-on: ubuntu-latest
    # A hung test otherwise burns the six-hour default. Everything here is
    # offline and fast; twenty minutes is generous, not tight.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No `version:` input: pnpm/action-setup refuses to run when it is given
      # both that and a `packageManager` field, and package.json pins the pnpm
      # version exactly, in `packageManager`. One source of truth, and the
      # action reads it.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      # The unit and mock suites run in the `test` job below, once per harness
      # channel; coverage, further down, is the alpha (default) install's.
      - run: pnpm run build
      - run: node --experimental-strip-types scripts/check.ts
      # Coverage as its own step, not folded into `test`: the ratchet only means
      # something if it can fail a build. Uploaded so a PR can be diffed against
      # `main` rather than only against the threshold.
      - run: pnpm run test:coverage
      - name: upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage
          retention-days: 7

  # The plugin supports the latest release of BOTH harness channels (D14'',
  # D22''): `rc` is the newest rc build (`dsh@next`, ahead of `dsh@latest`),
  # `alpha` is `dsh@alpha`. Each channel's default install is what an npm user
  # runs, the channel's cluster with pi unpatched at the newest version the
  # bridge's range admits, pinned by that channel's committed lockfile (the
  # root one for alpha, `channels/rc/pnpm-lock.yaml` for rc).
  # `scripts/use-channel.ts` switches the install, and `DSH_CHANNEL`/`DSH_PI`
  # tell `test/host-versions.test.ts` which record to hold the tree to, so a
  # switch that silently did not happen fails there by name. Two exceptions to
  # "what an npm user runs": the lockfiles pin the whole cordis family
  # (cordis, the loader and the plugins beside them) at the record's versions,
  # the floors of the `~` ranges the cluster declares, what the harness
  # vendors at the tag, where npm lets it float to the newest patch (the
  # `e2e-host` job's `npm` cell is the run that lets cordis float); and the
  # switch also repins the plugin's own `@deepseek-ai/schemastery` to the
  # channel's line, so the rc cell runs the host's schemastery, not the
  # plugin's published pin (which is the alpha line).
  #
  # The floor cells (pi at the range's floor: 1.3.0 on both channels, the
  # pi the desktop app ships, unpatched) run nightly and on dispatch, not on
  # every pull request: they are the oldest pi a supported host can run, which
  # moves only when a channel does.
  test:
    name: test · ${{ matrix.channel }}${{ matrix.pi == 'floor' && ' · pi floor' || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        channel: [alpha, rc]
        pi: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["newest","floor"]' || '["newest"]') }}
    env:
      DSH_CHANNEL: ${{ matrix.channel }}
      DSH_PI: ${{ matrix.pi }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: switch to the ${{ matrix.channel }} install
        run: node --experimental-strip-types scripts/use-channel.ts "$DSH_CHANNEL" ${{ matrix.pi == 'floor' && '--floor' || '' }}
      - run: pnpm run test
      # The zen/go compatibility matrix, offline: `test/mock/` boots a Vite
      # server that answers the gateway's endpoints in their own wire formats
      # and refuses a request whose shape its endpoint does not accept.
      # Deterministic and secretless, so unlike the e2e job it gates every
      # push and every PR.
      - run: pnpm run test:mock
      # A switch restores every tracked file it rewrote; anything left over
      # would be a switch that leaks into a commit.
      - name: the switch left the tree clean
        run: git diff --exit-code && test -z "$(git status --porcelain)"

  # The channel records name each channel's latest release, and the harness
  # cuts a release without telling this repository. Nightly and on dispatch,
  # `scripts/report-host-drift.ts` reads the registry the way the records are
  # defined (dsh as the newest build any dist-tag carries on the channel's
  # line, since the rc line publishes under `next` ahead of `latest`, or a
  # newer stable release, the line graduating, under the tag the record names
  # for that: `latest` for rc, none for alpha; pi at the newest version the
  # bridge's range admits, and that range's floor; each cordis-family member
  # at the floor of the `~` range that cluster declares for it, the desktop's
  # tree, so a newer patch inside a range is not drift) and prints one warning
  # per field it compares that moved past `test/support/host-versions.ts`. It
  # REPORTS and never gates, so it exits 0 whatever it finds: a channel moving
  # is the harness's release, not a regression. P-T3 turns the report into a
  # proposed bump pull request; the bump follows CONTRIBUTING's release step 3.
  host-drift:
    name: harness channels · drift report
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --experimental-strip-types scripts/report-host-drift.ts

  # `engines.node` promises >=24 and every other job runs 26, so the floor was a
  # claim nothing exercised. The suites that depend on the engine (node:sqlite,
  # Intl.DurationFormat and its ICU strings) are exactly the ones that differ
  # between majors, so the floor gets its own offline run of the unit and mock
  # suites. Raise this together with `engines.node`.
  engine-floor:
    name: test · node 24 (engines floor)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Shuffled here, and in order in the main job: the two runs together show a
      # case that passes only because of what an earlier case left behind. The
      # seed is printed, so a failure reproduces with `--sequence.seed=<n>`.
      - run: pnpm run test:shuffle
      - run: pnpm run test:mock

  # The bundled catalog is generated from models.dev, and the one field that went
  # stale before (`provider_npm`) put nine models on an endpoint that cannot
  # serve them — a WRONG answer rather than a missing one, and invisible to the
  # unit suite. Regenerating on a schedule turns the vendor's next change into a
  # diff to review instead of a bug to diagnose.
  #
  # WHAT THIS GATES, and what it deliberately does not. The failure it exists
  # for is an OMISSION: someone changes a generator - or the parser it calls -
  # and forgets to regenerate, so the wrong `provider_npm` ships. That is a fact
  # about a pull request's OWN diff, so the diff decides. On a pull request each
  # of the three checks (`catalog:shim`, `limits:shim`, `cli:version`) GATES
  # only when the diff touches one of that check's INPUTS: its script and every
  # local module the script loads, transitively (a type-only import loads
  # nothing), plus `src/identity.ts`, which `cli:version` reads as data.
  # Otherwise it REPORTS - a warning, exit 0. One half of `cli:version` gates
  # every pull request regardless: the offline scan that every copy of the CLI
  # version in the tree agrees with the pin, which reads only the files the
  # repository maintains (never the generated tables, which hold vendor data),
  # so no vendor move can break it.
  # `scripts/freshness-scope.ts` derives the inputs from the sources themselves
  # and makes the call, so adding an import to a generator moves its inputs
  # without anyone editing a list. The generated files are never inputs: a pull
  # request that only carries a refresh reports drift rather than failing on it,
  # and one that edits a generated file without touching its generator gets a
  # warning naming the file, since a hand-edit is forbidden.
  #
  # Why a pull request is not gated on drift alone: the vendor's catalog, its Go
  # limits page and its CLI version move most days, and each move used to turn
  # every open pull request red although none of them caused it. Vendor drift
  # is not a pull request's regression. The nightly run notices all three. For
  # the two generated tables it regenerates them and proposes the refresh as a
  # pull request of its own, which is where it is reviewed. For the CLI version
  # it only warns: the bump is a human pull request to `src/identity.ts` (and
  # its copies), which gates, because the pin is one of the check's inputs.
  #
  # The gates FAIL CLOSED. Each runs unless the scope step answered "report",
  # so a lost answer (the step moved below its readers, an output renamed)
  # falls back to gating every pull request, which is loud, rather than to
  # running nothing, which is not.
  #
  # A push to main is the same question with the same answer. `main` was
  # reviewed with a current shim; the vendor may have rotated rows in the
  # minutes since. The runtime already refreshes the catalog on its own (SWR, 1h
  # TTL), so a shim a few hours behind only affects a cold start - it is not a
  # regression the push introduced. Failing there turned upstream churn into a
  # red main several times in one afternoon, which is how a signal gets
  # ignored. So on main it REPORTS (a warning, and the nightly proposes the
  # refresh) rather than failing.
  #
  # Fork PRs run the same scoped checks: they read only public sources, and the
  # job's write access is used by the nightly path alone, which a fork never
  # triggers.
  catalog:
    name: catalog freshness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Write access is needed by the nightly path alone, which proposes the
    # refresh as a pull request instead of failing. The gate steps never write.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Two commits: on a pull request HEAD is the merge ref, whose first
          # parent is the base, so `HEAD^1..HEAD` is exactly the PR's own diff.
          # The default depth of one would leave `HEAD^1` missing.
          fetch-depth: 2
          # Keep no credential in git's config. Checkout would persist
          # GITHUB_TOKEN as an http extraheader, which git sends ahead of the
          # token the nightly push names in its URL: the refresh then lands as
          # github-actions[bot], and its pull request's CI waits for a human
          # to approve it (the 2026-11-06 and 2026-11-12 refreshes did). No
          # other step here needs a git credential.
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: which checks does this pull request gate? (pull requests)
        id: scope
        if: github.event_name == 'pull_request'
        run: |
          changed="$RUNNER_TEMP/changed-files"
          git diff --name-only HEAD^1 HEAD > "$changed"
          # Printed, so the decision below can be checked against what it read.
          echo "this pull request changes $(wc -l < "$changed") file(s):"
          cat "$changed"
          # decide <output key> <check>: "gate" when the diff touches one of
          # the check's inputs, "report" otherwise. Any warning the script
          # raises (a generated file changed without its generator) goes to
          # stderr, kept apart from the answer and printed after it.
          decide() {
            notes="$RUNNER_TEMP/scope-notes"
            scope=$(node --experimental-strip-types --disable-warning=ExperimentalWarning \
              scripts/freshness-scope.ts "$2" < "$changed" 2> "$notes") \
              || { cat "$notes"; exit 1; }
            cat "$notes"
            case "$scope" in
              gate | report) ;;
              *) echo "::error::freshness-scope answered '$scope' for $2"; exit 1 ;;
            esac
            echo "$2: $scope"
            echo "$1=$scope" >> "$GITHUB_OUTPUT"
          }
          decide catalog catalog:shim
          decide limits limits:shim
          decide cli cli:version
      - name: is src/catalog-data.ts current? (pull requests touching its generator)
        if: github.event_name == 'pull_request' && steps.scope.outputs.catalog != 'report'
        run: |
          # Exits 1 on a stale shim and prints what would change. This pull
          # request changed what generates the shim, so a forgotten
          # regeneration is its own omission, and still fixable: a gate.
          pnpm run catalog:shim || {
            echo "::error::src/catalog-data.ts is out of date — run 'pnpm run catalog:shim -- --write' and commit the result."
            exit 1
          }
      - name: report a stale catalog (other pull requests, and pushes to main)
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && steps.scope.outputs.catalog == 'report')
        run: |
          # A warning, not a failure. A pull request that touched no input of
          # the generator, or a push to main: vendor drift is not a regression
          # of the change under test. The nightly run proposes the refresh.
          pnpm run catalog:shim \
            || echo "::warning::src/catalog-data.ts is stale - the registry moved; this run does not gate on vendor drift, and the nightly refresh will propose it."
      # The Go plan's per-model dollar allowance, from OpenCode's own docs. It
      # moves when THEY move — the page says limits "may change as we learn from
      # early usage and feedback" — and a stale table shows a wrong dollar figure
      # that looks authoritative, which is worse than showing none.
      - name: is src/go-limits-data.ts current? (pull requests touching its generator)
        if: github.event_name == 'pull_request' && steps.scope.outputs.limits != 'report'
        run: |
          pnpm run limits:shim || {
            echo "::error::src/go-limits-data.ts is out of date — run 'pnpm run limits:shim -- --write' and commit the result."
            exit 1
          }
      - name: report a stale limits table (other pull requests, and pushes to main)
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && steps.scope.outputs.limits == 'report')
        run: |
          pnpm run limits:shim \
            || echo "::warning::src/go-limits-data.ts is stale - the vendor's docs page moved; this run does not gate on vendor drift, and the nightly refresh will propose it."

      # The nightly run exists to NOTICE vendor drift, and drift is the normal
      # case - the sources move most days. Failing here meant a red run every
      # night, which trains everyone to ignore the signal. So the nightly path
      # regenerates and proposes a pull request; the refresh gates above run on
      # a pull request that touches a generator (where a forgotten regeneration
      # is still fixable); any other pull request, and a push to main, only
      # reports. A manual dispatch runs neither shim check - only the CLI
      # version's report below.
      #
      # The User-Agent names the CLI version, and the vendor moves it every few
      # days - which is the same shape again, with one difference: the script
      # checks two things. Every copy of the version in the tree agreeing with
      # `src/identity.ts` is offline, and only the repository can break it, so
      # it gates every pull request. The pin being the published version follows
      # the vendor, so it gates only a pull request that touches the pin or the
      # script, and warns everywhere else - quoting the script's own `error:`
      # line, so the warning names the cause that failed.
      - name: every copy of the CLI version agrees with the pin (pull requests)
        if: github.event_name == 'pull_request'
        run: pnpm run cli:version -- --copies
      - name: the claimed CLI version is the published one (pull requests touching it)
        if: github.event_name == 'pull_request' && steps.scope.outputs.cli != 'report'
        run: pnpm run cli:version
      - name: report a stale CLI version (other pull requests, push, nightly and dispatch)
        if: github.event_name != 'pull_request' || steps.scope.outputs.cli == 'report'
        run: |
          # The default shell has no pipefail, without which `tee` would answer
          # for the check and the warning below could never fire.
          set -o pipefail
          log="$RUNNER_TEMP/cli-version.log"
          pnpm run cli:version 2>&1 | tee "$log" \
            || echo "::warning::$(grep -m 1 '^error: ' "$log" || echo 'cli:version failed - see the log above')"

      - name: propose the refresh (nightly only)
        if: github.event_name == 'schedule'
        env:
          # PAT, not GITHUB_TOKEN. The push decides the run: a branch pushed
          # with the checkout credential is attributed to github-actions[bot],
          # and GitHub parks the pull_request run in action_required - the
          # first refresh arrived that way, with no CI until a human approved
          # the run by hand. Pushed with the PAT the actor is the PAT's owner,
          # which is how the release PRs get their checks. Same secret
          # release-please uses.
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          # The two sources break independently, and the limits page has: from
          # 2026-11-07 its generator failed every night, and because it ran
          # in a fail-fast step after the catalog's, no catalog refresh was
          # proposed either. So each generator is guarded the same way: a
          # failure is annotated where it is detected (a later command that
          # fails the step cannot swallow the cause), its file is put back as
          # committed, the other file's refresh still goes out, and the step
          # fails at the end. The catalog runs first and is put back BEFORE
          # the limits generator starts, because that generator imports
          # src/catalog-data.ts: it then reads the committed catalog, never a
          # half-written one. A pull request that could not be opened fails
          # the step the same way.
          catalog=ok
          proposal=ok
          kept=""
          pnpm run catalog:shim -- --write || {
            catalog=failed
            kept="$kept src/catalog-data.ts"
            echo "::error::the catalog generator failed (its output is above); src/catalog-data.ts is left as committed and is not part of any refresh this run proposes"
            git checkout -- src/catalog-data.ts
          }
          limits=ok
          pnpm run limits:shim -- --write || {
            limits=failed
            kept="$kept src/go-limits-data.ts"
            echo "::error::the Go limits generator failed (its output is above); src/go-limits-data.ts is left as committed and is not part of any refresh this run proposes"
            git checkout -- src/go-limits-data.ts
          }
          # The generators emit compact JSON; the repository formats its
          # sources. Without this the comparison below always sees a diff and
          # every nightly run would open a pull request whose entire content is
          # reformatting - the opposite of "open one when upstream moved".
          pnpm exec vp fmt --write src/catalog-data.ts src/go-limits-data.ts
          if git diff --quiet -- src/catalog-data.ts src/go-limits-data.ts; then
            # A file whose generator failed was put back, not regenerated, so
            # only the files that did regenerate are known to be current.
            if [ -n "$kept" ]; then
              echo "no change in any file that regenerated - no pull request; not regenerated:${kept}"
            else
              echo "both generated files are current - no upstream change, no pull request"
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git checkout -B chore/generated-refresh
            git add src/catalog-data.ts src/go-limits-data.ts
            git commit -m "chore: refresh the generated catalog and limits tables"
            # Explicit token URL, and no credential persisted by the checkout
            # (see its persist-credentials): a push authenticated as the
            # checkout's GITHUB_TOKEN is what lands the run in action_required.
            git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" chore/generated-refresh
            # The branch is rebuilt from main every night, so a partial
            # refresh REPLACES an open refresh pull request: an earlier
            # night's change to a file kept above is no longer proposed until
            # its generator works again. Deliberate - an older night's output
            # is never carried into a commit that says it was regenerated -
            # and said here, because the pull request itself cannot say it.
            if [ -n "$kept" ]; then
              echo "::warning::chore/generated-refresh was replaced by a partial refresh: an open refresh pull request no longer proposes any change to${kept} until its generator works again"
            fi
            # `gh pr create` also fails when a refresh pull request is already
            # open, which the force-push above has just updated. Whether one is
            # open is ASKED, never assumed: an expired token, a missing scope or
            # an API error must not pass for it and leave a pushed branch that
            # no pull request proposes behind a green run.
            if ! gh pr create --head chore/generated-refresh \
              --title "chore: refresh the generated catalog and limits tables" \
              --body "The nightly freshness check found the vendor sources moved. Regenerated by CI - review the diff and merge."; then
              if [ "$(gh pr list --head chore/generated-refresh --state open --json number --jq length)" = 1 ]; then
                echo "a refresh pull request is already open"
              else
                proposal=failed
                echo "::error::could not open the refresh pull request (gh's output is above), and none is open: chore/generated-refresh is pushed and proposed by no pull request"
              fi
            fi
          fi
          # Each failure was annotated where it happened; this only fails the run.
          if [ "$catalog" = failed ] || [ "$limits" = failed ] || [ "$proposal" = failed ]; then
            exit 1
          fi

  # The live gateway contract: the only job that talks to OpenCode itself, so a
  # vendor payload change fails here rather than in a user's meter.
  #
  # What may spend a key is a tier (OPENCODE_E2E_KEYED), decided per event by
  # the `tier` step:
  #
  # - `none`: spends no key, so only the keyless cases run — the keyless
  #   matrix, the keyless free-model probe, the System One family's three
  #   shapes (recorded), and the keyless cases of protocol-routing and
  #   opencode-live. Every pull request that does not
  #   touch the scope below, and a push to main.
  # - `probes`: adds the minimal keyed probes (keyed-probes.e2e.ts), one
  #   request of a few tokens per plane × protocol × URL shape, plus six
  #   recorded variants of each plane's default completions cell (request
  #   id, project, reasoning effort; KEYED_VARIANTS) and every 429's
  #   Retry-After. A pull request
  #   that touches src/host/**; src/utils/protocols.ts, which decides the
  #   legacy URLs the probes send and the protocol each probe model speaks;
  #   src/utils/plane-model.ts, which decides the family the plugin
  #   dispatches to (AUTO_ENDPOINT_FAMILY), which the probes must keep
  #   matching; src/identity.ts, whose CLI version is in the user agent the
  #   probes carry; src/utils/request-shape.ts, the anthropic-version every
  #   Messages probe sends; or the probes' own inputs. Nothing else arms
  #   them. Left out, and covered by the offline suite and the nightly run,
  #   which arms everything: the generated catalog (src/catalog-data.ts) and
  #   the live model choice (src/models-catalog.ts), which pick the probes'
  #   modern URLs and models and whose paths the keyless matrix checks on
  #   every pull request; and the OPENCODE_UA alias in src/session.ts, which
  #   a turn and a probe share, so test/keyed-probes.test.ts holds the
  #   probe's identity to the real fetch patch offline.
  # - `full`: adds the full keyed suites (protocol-routing, opencode-live,
  #   dispatch-levels). Nightly and on dispatch.
  #
  # The keys are armed only when the tier is not `none`, by the sign-in step:
  # GitHub mints a short-lived OIDC token for the Console's audience, the
  # Console exchanges it for an access token, and only that token reaches the
  # suite's environment. Nothing long-lived is stored in this repository or in
  # Actions secrets. A fork or Dependabot pull request is issued neither an
  # OIDC endpoint nor secrets, so the step exits with a notice and the keyed
  # cases skip exactly as they do when the tier is `none`, while the keyless
  # cases still check that the endpoints answer. The Console CI token's client
  # id is public by design (the exchange binds it to the audience and the
  # GitHub OIDC subject, so the id alone grants nothing) and it lives in the
  # `OPENCODE_CONSOLE_CLIENT_ID` repository variable, not here: its `sk_` shape
  # is indistinguishable from a Checkout.com secret key to a scanner, and a
  # literal in this file raised a false-positive secret-scanning alert.
  #
  # Both probe suites write a dated table of what each URL shape answered
  # (docs/redirect-planes.md §13); the job appends them to the run summary and
  # uploads them as the `endpoint-families` artifact.
  e2e:
    name: e2e · live gateway
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: which keyed tier does this run arm?
        id: tier
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            schedule|workflow_dispatch) tier=full ;;
            pull_request)
              # Its own command, so a diff that cannot be computed fails the
              # step rather than reading as "nothing changed".
              changed="$(git diff --name-only "origin/${BASE_REF}...HEAD")"
              # The listed modules, and nothing else: the host seam, the
              # legacy URLs and protocols the probes send (protocols.ts), the
              # family the plugin dispatches to (plane-model.ts), the CLI
              # version in the user agent the probes carry (identity.ts), the
              # anthropic-version every Messages probe sends
              # (request-shape.ts), and the probes' own inputs, CI arming
              # and the environment reader that arms a key (e2e-env.ts)
              # included. Left out, and covered by the offline suite and the
              # nightly `full` run: the generated catalog (catalog-data.ts)
              # and the live model choice (models-catalog.ts), which the
              # keyless matrix checks on every pull request, and the
              # OPENCODE_UA alias (session.ts), which the turn and the probe
              # share and test/keyed-probes.test.ts holds offline.
              # test/keyed-probes.test.ts compiles this pattern and checks
              # it. grep reads a here-string, not a pipe: under
              # pipefail, `grep -q` exiting on an early match could kill the
              # writer with SIGPIPE on a long path list and read as a miss.
              if grep -Eq '^(src/host/|src/utils/protocols\.ts$|src/utils/plane-model\.ts$|src/identity\.ts$|src/utils/request-shape\.ts$|test/e2e/keyed-probes\.e2e\.ts$|test/support/keyed-probes\.ts$|test/support/keyless-matrix\.ts$|test/support/e2e-env\.ts$|\.github/workflows/ci\.yml$)' <<<"$changed"; then
                tier=probes
              else
                tier=none
              fi
              ;;
            *) tier=none ;;
          esac
          echo "keyed tier: $tier"
          echo "keyed=$tier" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Sign in to OpenCode Console
        if: steps.tier.outputs.keyed != 'none'
        env:
          AUDIENCE: https://opencode.ai/console
          CLIENT_ID: ${{ vars.OPENCODE_CONSOLE_CLIENT_ID }}
        run: |
          # A fork or Dependabot pull request is issued no OIDC endpoint; leave
          # the suite keyless, as its keyed cases already expect.
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::notice::no OIDC identity for this run; the keyed cases will skip"
            exit 0
          fi
          oidc=$(curl -sSf --oauth2-bearer "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE" | jq -r .value)
          token=$(curl -sSf https://opencode.ai/console/auth/oauth/token \
            -d grant_type=urn:ietf:params:oauth:grant-type:token-exchange \
            -d subject_token_type=urn:ietf:params:oauth:token-type:jwt \
            -d client_id="$CLIENT_ID" \
            -d subject_token="$oidc" | jq -r .access_token)
          echo "::add-mask::$token"
          # One workspace credential serves both planes; the suite reads the two
          # names it always has, and only this step arms them.
          {
            echo "OPENCODE_API_KEY=$token"
            echo "OPENCODE_GO_API_KEY=$token"
          } >> "$GITHUB_ENV"
      - run: pnpm run test:e2e
        env:
          OPENCODE_E2E: "1"
          OPENCODE_E2E_KEYED: ${{ steps.tier.outputs.keyed }}
          OPENCODE_E2E_RECORD_DIR: ${{ runner.temp }}/endpoint-families
      - name: publish the endpoint-family record to the run summary
        if: always()
        env:
          RECORD_DIR: ${{ runner.temp }}/endpoint-families
        run: |
          for file in keyless.md keyed.md; do
            if [ -f "$RECORD_DIR/$file" ]; then
              cat "$RECORD_DIR/$file" >> "$GITHUB_STEP_SUMMARY"
              echo >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - name: upload the endpoint-family record
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: endpoint-families
          path: ${{ runner.temp }}/endpoint-families
          if-no-files-found: ignore
          retention-days: 30

  # The published host binary with this checkout linked into a throwaway
  # profile: the only run that boots `dsh` itself rather than the host packages
  # the unit suite assembles. `test/e2e/host/probe-plugin.mjs` measures the
  # registry, the listings, validation, where each turn is sent and the save of
  # a catalog-unknown id, and `test/e2e/host-binary.e2e.ts` asserts today's
  # rows (`S0_TODAY_BY_CELL`, shared with the in-process characterization).
  #
  # One run per harness channel (D14''), each the channel's published binary
  # (`dsh@<record>` from `test/support/host-versions.ts`) installed with npm the
  # way a user installs it, pi unpatched in both cells:
  # - `npm`: the published host exactly as npm resolves it, cordis and pi
  #   included. The record's newest pi asserts the rows wherever the route
  #   claim engages; a pi published since the record skips the rows that
  #   depend on which ids pi describes, with a warning (the nightly
  #   `host-drift` job names it). The route claim engages whichever
  #   `internal/config` call shape the host dispatches (the probe counts every
  #   call's shape), and a `[BASELINE]` row asserts that both planes are the
  #   plugin's PlaneAdapter; where the host itself cannot save, the save rows
  #   skip. Never cached: re-resolving is the point.
  # - `floor`: the tree the desktop app ships, forced with npm `overrides`
  #   (`floorOverrides` in host-versions.ts): the channel's whole cordis family
  #   at the record's versions (the floors of the ranges the cluster declares,
  #   what the harness vendors at the tag) and pi with its telemetry package
  #   at the bridge range's floor (pi patched there, not here; the patch
  #   touches nothing the plugin reads). Cached by the channel, its dsh and a
  #   hash of those overrides, so a cache filled before the record or its
  #   overrides moved is never reused; the rest of the tree is what npm
  #   resolved when the cache was filled.
  # Pull requests run the `npm` cell of both channels, and only when they touch
  # the host seam; dispatch and the nightly run add both `floor` cells.
  #
  # The scope is decided by a step rather than by `on.pull_request.paths`: a
  # workflow-level path filter would silence every other job in this file.
  # Offline: the probe answers every gateway request itself, and the keys it
  # stores are dummies. No secret is passed.
  e2e-host:
    name: e2e · host binary (${{ matrix.channel }} · ${{ matrix.cell }})
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        channel: [alpha, rc]
        cell: ${{ github.event_name == 'pull_request' && fromJSON('["npm"]') || fromJSON('["npm","floor"]') }}
    env:
      DSH_CHANNEL: ${{ matrix.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: does this change touch the host seam?
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Its own command, so a diff that cannot be computed (a base ref
          # that was not fetched, a deleted base branch) fails the step rather
          # than reading as "nothing changed" and skipping the job green.
          changed="$(git diff --name-only "origin/${BASE_REF}...HEAD")"
          # The job's own definition and runner config are in scope: a pull
          # request that breaks the install, the override or the e2e config
          # must run the job it breaks. That includes vite.config.ts: it holds
          # the pack config that builds lib/index.mjs (the only test that
          # loads that bundle into a real host is this one, and its externals
          # keep cordis and schemastery the host's copies) and the test
          # settings vitest.e2e.config.ts inherits. test/support/host-versions.ts
          # names the binary each channel installs, and scripts/host-drift.ts
          # holds the family table the binary e2e asserts against the installed
          # manifests. package.json is not (every
          # dependency bump touches it), so a change to its `test:e2e:host`
          # script alone is exercised only by the nightly run.
          # The host seam lives under src/host/ (the route claim, the plane
          # adapter, the Settings graft, the host-module loaders), and the
          # modules whose behaviour depends on the real loader and apply order
          # sit beside it by name: the composition (lifecycle.ts, identity.ts),
          # the host-module seam (cordis-context.ts), the remaining discovery
          # patch (models-discovery.ts), and the two modules that still install
          # host-level patches until P6/P10a move them under src/host/: the
          # global fetch wrapper (fetch-patch.ts, whose order the probe reads
          # as fetchInnermost) and the llm/stream hook (stream-hook.ts). Every
          # other row producer (the pure plane profile and model in
          # src/utils/, key-capture.ts, models-catalog.ts, config.ts, the
          # generated catalog) is covered on each pull request by the
          # in-process characterization of the same rows, on both channels,
          # and here by the nightly run.
          # The binary e2e's own inputs are in scope too: the file, the rows it
          # asserts (support/host.ts), the versions it installs
          # (support/host-versions.ts, which also selects its channel) and the
          # reader its gate, prefix and cell come through (support/e2e-env.ts).
          # test/keyed-probes.test.ts compiles this pattern and checks it.
          # A here-string, not a pipe: see the e2e job's tier step.
          if grep -Eq '^(src/host/|src/lifecycle\.ts$|src/identity\.ts$|src/cordis-context\.ts$|src/models-discovery\.ts$|src/fetch-patch\.ts$|src/stream-hook\.ts$|cordis\.patch\.yml$|test/e2e/host/|test/e2e/host-binary\.e2e\.ts$|test/support/host\.ts$|test/support/host-versions\.ts$|test/support/e2e-env\.ts$|scripts/host-drift\.ts$|\.github/workflows/ci\.yml$|vitest\.e2e\.config\.ts$|vite\.config\.ts$)' <<<"$changed"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "no host-seam path changed; the host binary e2e does not run for this pull request"
          fi
      - if: steps.scope.outputs.run == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - if: steps.scope.outputs.run == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - if: steps.scope.outputs.run == 'true'
        run: pnpm install --frozen-lockfile
      - name: the ${{ matrix.channel }} channel's record
        id: versions
        if: steps.scope.outputs.run == 'true'
        run: |
          node --experimental-strip-types --input-type=module -e "import { createHash } from 'node:crypto'; import { CHANNELS, floorOverrides } from './test/support/host-versions.ts'; const r = CHANNELS[process.env.DSH_CHANNEL]; const overrides = JSON.stringify(floorOverrides(r)); console.log('dsh=' + r.dsh); console.log('pi=' + r.pi); console.log('piRange=' + r.piRange); console.log('floorOverrides=' + overrides); console.log('floorKey=' + createHash('sha256').update(overrides).digest('hex').slice(0, 16))" >> "$GITHUB_OUTPUT"
          echo "PREFIX=$RUNNER_TEMP/dsh-host" >> "$GITHUB_ENV"
      # The floor install forces every version that matters (the record's
      # cordis family and the floor pi pair), so it is cached by the channel,
      # its dsh and a hash of those overrides; the npm one is the point of
      # re-resolving, so never.
      - name: cache the floor host install
        id: host-cache
        if: steps.scope.outputs.run == 'true' && matrix.cell == 'floor'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/dsh-host
          key: dsh-host-floor-${{ matrix.channel }}-${{ steps.versions.outputs.dsh }}-${{ steps.versions.outputs.floorKey }}
      - name: install the published host into a throwaway prefix
        if: steps.scope.outputs.run == 'true' && steps.host-cache.outputs.cache-hit != 'true'
        env:
          CELL: ${{ matrix.cell }}
          DSH: ${{ steps.versions.outputs.dsh }}
          FLOOR_OVERRIDES: ${{ steps.versions.outputs.floorOverrides }}
        run: |
          mkdir -p "$PREFIX"
          # The overrides must be in the prefix's own package.json BEFORE the
          # install, or npm resolves the bridge's ^range to the newest pi and
          # the host's ~ ranges to the newest cordis patch.
          if [ "$CELL" = floor ]; then
            node -e "process.stdout.write(JSON.stringify({ private: true, overrides: JSON.parse(process.env.FLOOR_OVERRIDES) }) + '\n')" > "$PREFIX/package.json"
          else
            printf '{ "private": true }\n' > "$PREFIX/package.json"
          fi
          npm install --prefix "$PREFIX" --no-audit --no-fund "@deepseek-ai/dsh@$DSH"
      - name: report the pi and the cordis family the host resolved
        if: steps.scope.outputs.run == 'true'
        env:
          CELL: ${{ matrix.cell }}
          PI: ${{ steps.versions.outputs.pi }}
          FLOOR_OVERRIDES: ${{ steps.versions.outputs.floorOverrides }}
        run: |
          resolved="$(node -p "require(process.env.PREFIX + '/node_modules/@earendil-works/pi-ai/package.json').version")"
          echo "${DSH_CHANNEL} · ${CELL}: pi $resolved"
          copies="$(find "$PREFIX/node_modules" -path '*/@earendil-works/pi-ai/package.json' | wc -l)"
          if [ "$copies" -ne 1 ]; then
            echo "::error::expected one copy of pi under the host prefix, found $copies"
            exit 1
          fi
          if [ "$CELL" = npm ] && [ "$resolved" != "$PI" ]; then
            echo "::warning::npm resolved pi $resolved for ${DSH_CHANNEL}, not the record's $PI: the rows that depend on which ids pi describes are skipped"
          fi
          # Every package the floor cell forces (the pi pair and the cordis
          # family): the floor cell must hold exactly the override, a cached
          # prefix included, which catches npm ignoring one; the npm cell
          # reports what npm resolved, which is the channel's release as a
          # user gets it. Whether the record's values are right is not this
          # step's: the binary e2e holds them to the ranges the installed
          # published packages declare, and the nightly drift report to the
          # registry's.
          failed=0
          for name in $(node -p "Object.keys(JSON.parse(process.env.FLOOR_OVERRIDES)).join(' ')"); do
            want="$(node -p "JSON.parse(process.env.FLOOR_OVERRIDES)['$name']")"
            got="$(node -p "require(process.env.PREFIX + '/node_modules/$name/package.json').version")"
            echo "${DSH_CHANNEL} · ${CELL}: $name $got"
            if [ "$CELL" = floor ] && [ "$got" != "$want" ]; then
              echo "::error::the floor cell resolved $name $got, not the record's $want"
              failed=1
            fi
          done
          exit "$failed"
      - if: steps.scope.outputs.run == 'true'
        run: pnpm run build
      - name: boot the host binary with the probe
        if: steps.scope.outputs.run == 'true'
        run: pnpm run test:e2e:host --run
        env:
          DSH_HOST_E2E: "1"
          DSH_HOST_PREFIX: ${{ runner.temp }}/dsh-host
          DSH_HOST_PI_CELL: ${{ matrix.cell }}
          DSH_HOST_PROBE_COPY: ${{ runner.temp }}/probe-${{ matrix.channel }}-${{ matrix.cell }}.json
      - name: upload the probe's measurement
        if: always() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: host-probe-${{ matrix.channel }}-${{ matrix.cell }}
          path: ${{ runner.temp }}/probe-${{ matrix.channel }}-${{ matrix.cell }}.json
          if-no-files-found: ignore
          retention-days: 7
