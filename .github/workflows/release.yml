name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run test

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: tag matches package.json version
        run: |
          test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}" \
            || { echo "tag ${GITHUB_REF_NAME} != package.json version"; exit 1; }
      - run: pnpm run build
      # OIDC trusted publishing: no token needed. Requires the
      # viztor/dsh-opencode + release.yml publisher registered on npmjs.com
      # with `npm publish` allowed. Provenance is automatic. The version
      # guard keeps re-runs idempotent (a published version is skipped,
      # so a failed mirror step can be retried by re-pushing the tag).
      - name: publish to npmjs (OIDC)
        run: |
          VER=$(node -p "require('./package.json').version")
          if npm view "@viztor/dsh-opencode@$VER" version 2>/dev/null; then
            echo "$VER already on npmjs, skipping"
          else
            npm publish --access public
          fi
      # Mirror to GitHub Packages so the repo sidebar populates. Auth rides
      # on the command line (file appends proved unreliable across
      # setup-node's temp userconfig). Installs still come from npmjs.org
      # unless a consumer repoints the scope.
      - name: mirror to GitHub Packages
        run: npm publish --registry=https://npm.pkg.github.com --access public --//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
