name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    # A run takes about a minute; bounded so a hung API call cannot hold a
    # runner for GitHub's six hours.
    timeout-minutes: 10
    steps:
      # Scans conventional commits (feat:/fix:) since the last tag, opens a
      # version-bump + changelog PR; merging it creates the tag + GitHub
      # Release, which fires the `release` workflow (npm + GitHub Packages).
      # PAT (not GITHUB_TOKEN): tags/releases created with the built-in
      # token don't trigger downstream workflows, so the `release` job
      # would never fire. Secret: RELEASE_PLEASE_TOKEN, fine-grained PAT
      # with Contents + Pull requests read/write on this repo.
      #
      # Manifest mode, not release-type alone: the latest-release lookup
      # only considers the last 250 merge commits, and this repo sits
      # further than that from its last release, so the lookup finds
      # nothing and the fallback scan re-reads a `Release-As: 1.0.0` commit
      # from 2026-10-09 (it proposed a downgrade). The manifest pins the
      # base version; the release SHA is then resolved by exact version,
      # which the window cannot hide. What the changelog shows, and in what
      # order, lives in release-please-config.json: visible — what a user
      # gets (features, fixes, performance) plus documentation; hidden —
      # the maintenance noise (chores, CI, tests, build, refactors).
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
