name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Scans conventional commits (feat:/fix:) since the last tag, opens a
      # version-bump + changelog PR; merging it creates the tag + GitHub
      # Release, which fires the `release` workflow (npm + GitHub Packages).
      # PAT (not GITHUB_TOKEN): tags/releases created with the built-in
      # token don't trigger downstream workflows, so the `release` job
      # would never fire. Secret: RELEASE_PLEASE_TOKEN, fine-grained PAT
      # with Contents + Pull requests read/write on this repo.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          release-type: node
          # What the generated CHANGELOG shows, and in what order. Visible:
          # what a USER gets (features, fixes, performance) plus documentation.
          # Hidden: the maintenance noise (chores, CI, tests, build, refactors)
          # that a reader of a release note has no use for — it stays in the
          # commit log, which is where a maintainer looks for it.
          changelog-sections: |
            [
              { "type": "feat", "section": "Features" },
              { "type": "fix", "section": "Fixes" },
              { "type": "perf", "section": "Performance" },
              { "type": "docs", "section": "Documentation" },
              { "type": "refactor", "section": "Refactors", "hidden": true },
              { "type": "test", "section": "Tests", "hidden": true },
              { "type": "build", "section": "Build", "hidden": true },
              { "type": "ci", "section": "CI", "hidden": true },
              { "type": "chore", "section": "Chores", "hidden": true }
            ]
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
