# The one install every job runs: pnpm, Node and the dependencies, in that
# order. A local action is read from the workspace, so it cannot bring the
# checkout that puts it there: each job checks out first, with its own options
# (the catalog job's depth and credential-free checkout, host-drift's
# credential-free one, the e2e jobs' full history), and then uses this.
name: setup
description: pnpm from packageManager, Node from .node-version (or an input), and a frozen install.

inputs:
  node-version:
    description: The Node major to run instead of .node-version's (the engines-floor job passes its floor).
    required: false
    default: ""
  registry-url:
    description: The registry setup-node writes an .npmrc for (the publish job's).
    required: false
    default: ""

runs:
  using: composite
  steps:
    # No `version:` input: pnpm/action-setup refuses to run when it is given
    # both that and a `packageManager` field, and package.json pins the pnpm
    # version exactly, in `packageManager`. One source of truth, and the
    # action reads it.
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
    # The Node every job runs is named once, in .node-version, which
    # test/node-engine.test.ts holds at or above `engines.node`. The input is
    # passed through the environment, never interpolated into the script.
    - id: node
      shell: bash
      env:
        NODE_VERSION_INPUT: ${{ inputs.node-version }}
      run: echo "version=${NODE_VERSION_INPUT:-$(cat .node-version)}" >> "$GITHUB_OUTPUT"
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ steps.node.outputs.version }}
        cache: pnpm
        registry-url: ${{ inputs.registry-url }}
    - shell: bash
      run: pnpm install --frozen-lockfile
