# Both arrive as dependencies of @earendil-works/pi-ai, which the bridge loads at
# runtime from the host and the suite imports directly. Neither package's build
# script is needed, so their builds stay off rather than being approved.
allowBuilds:
  "@google/genai": false
  protobufjs: false
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.5.0
# pnpm refuses any version published inside the last 24h (its default
# `minimumReleaseAge`), and the pi seam this repo follows rides fresh cuts:
# the 0.2.2-rc.2 cluster the rc lockfile installs was hours old when it was
# recorded (2026-11-12). These are the exact versions that
# window is lifted for — the wrapper the bridge's pin has to satisfy and the
# harness packages it pulls — pinned, not wildcards, so the next bump has to
# make its own case. The 0.2.1 entries stay listed because the peer range still
# admits that line. What proves them is `pnpm run release:gate`, not their age.
minimumReleaseAgeExclude:
  - "@deepseek-ai/cordis@4.0.6-alpha.1"
  - "@deepseek-ai/schemastery@3.18.6-alpha.1"
  - "@deepseek-ai/cosmokit@1.8.7-alpha.1"
  - "@deepseek-ai/dsh-brand@0.2.1-alpha.5 || 0.2.1-rc.4 || 0.2.2-alpha.2 || 0.2.2-rc.2"
