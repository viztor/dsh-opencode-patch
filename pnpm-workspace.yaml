# Both arrive as dependencies of @earendil-works/pi-ai, which this repo pins to
# the harness's own copy (the overrides/patchedDependencies below); the bridge
# loads it at runtime from the host and the suite imports it directly. Neither
# package's build script is needed, so their builds stay off rather than being
# approved.
allowBuilds:
  "@google/genai": false
  protobufjs: false
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.2.0
  vite-plus: 1.2.0
# pnpm refuses any version published inside the last 24h (its default
# `minimumReleaseAge`). Nothing pinned here currently needs that window lifted:
# every exact version this repo installs is older than it. When a future exact
# version is refused for age, it goes in a `minimumReleaseAgeExclude:` list
# here, as `name@version` rather than a wildcard, so each bump makes its own
# case. What proves a version is `pnpm run release:gate`, not its age.
#
# The harness's own lockfile pins `@earendil-works/pi-ai` at 1.1.0 and patches
# it (D14). The override is the one statement that reaches every copy in the
# tree, whatever a dependent's range asks for. Today the exact root
# devDependency alone already pulls `dsh-llm-pi-ai`'s `^1.1.0` onto 1.1.0 (pnpm
# prefers a version a direct dependency pins); the override is what still holds
# when a dependent's range stops admitting 1.1.0 or a new one asks for another
# pi. (A registry install of the published host has no such pin, and npm floats
# the wrapper's range to the newest 1.x.) The patch is the harness's file,
# verbatim, and pnpm records its hash in the lockfile;
# `test/host-versions.test.ts` checks both.
overrides:
  "@earendil-works/pi-ai": "1.1.0"
  vite@*: "catalog:"
patchedDependencies:
  "@earendil-works/pi-ai@1.1.0": patches/@earendil-works__pi-ai@1.1.0.patch
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
