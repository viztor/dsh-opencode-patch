<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="OpenCode on DeepSeek Harness">
  <title>OpenCode on DSH</title>
  <defs>
    <linearGradient id="oc-frame" x1="17.6" y1="14" x2="46.4" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4D6BFE"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>
  <!--
    The DeepSeek Harness icon family: a softly tinted rounded square carrying
    one vibrant glyph — pale lavender container, DeepSeek-blue to purple hue.
    The glyph is OpenCode's own mark, exact proportions: a 4:5 block frame with
    a windowed counter (favicon geometry 256×320 / 64px walls, scaled ×0.1125
    and centered) — the frame alone, no inner block. Frame in the family
    gradient. Hard corners are deliberate — OpenCode is a blocky mark.
  -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="#EDEBFE"/>
  <path fill-rule="evenodd" d="M17.6 14 H46.4 V50 H17.6 Z M24.8 21.2 H39.2 V42.8 H24.8 Z" fill="url(#oc-frame)"/>
</svg>
