<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="OpenCode on DeepSeek Harness">
  <title>OpenCode on DSH</title>
  <defs>
    <linearGradient id="oc-glyph" x1="20" y1="22" x2="46" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4D6BFE"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>
  <!--
    The DeepSeek Harness icon family: a softly tinted rounded square carrying
    one vibrant glyph. Pale lavender container, DeepSeek-blue to purple
    terminal mark — the sibling of TinyFish's teal fish, distinct in hue,
    identical in language.
  -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="#EDEBFE"/>
  <path d="M22 24 L32 32 L22 40" fill="none" stroke="url(#oc-glyph)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="37" y="37.5" width="9" height="4.5" rx="2.25" fill="url(#oc-glyph)"/>
</svg>
